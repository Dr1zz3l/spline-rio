% 2026-09-17 (Fable, for Timo: "a radar profile config file with higher range resolution"): RANGE 3x variant.
% numAdcSamples 64 -> 192 at the same slope (100 MHz/us) and sample rate (9142 ksps): ADC window 7 -> 21 us,
% valid bandwidth 700 -> 2100 MHz, range bin 0.214 -> 0.071 m, max range unchanged (13.7 m, cfarFov 10.97).
% rampEnd 15 -> 29 us and idle 115 -> 101 us keep the chirp at 130 us (same-TX repetition 390 us), so v_max
% stays ~3.11 m/s (the carrier centre moves up with the bandwidth, lambda 4.86 mm). Loops 128 -> 64 (radar cube 192 x 192 chirps x 4 RX x 4 B = 590 KB, inside the 768 KB L3;
% 192 x 384 would be 1.2 MB): Doppler bin 0.049 -> 0.097 m/s, CPI 50 -> 25 ms, frames at 20 Hz (period 50 ms,
% duty 50 %). Range migration during the CPI at 3 / 5 m/s: 1.1 / 1.8 bins (was 0.7 / 1.2 at 0.214 m).
% CQ monitor slice counts scaled with the ADC window (best_velocity 19/31 at 7 us, 6843AOP_3d 99/111 at 32 us);
% if the firmware rejects the CQ lines, lower numSlices first. Needs its OWN latency measurement and law fit
% (documentation/todo/BACKFLIPS_PLAN.md) and a bags.yaml radar_config entry (v_max 3.112, bin 0.097, dr 0.0714; analysis/radar_config_spec.py).
